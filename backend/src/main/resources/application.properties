# ==== Servidor ====
server.port=8080
# Incluye el mensaje de response.sendError (por ejemplo, del filtro JWT) en el JSON de error
server.error.include-message=always

# ==== Base de datos PostgreSQL (ver docker-compose.yml) ====
# Estos valores los usa ConexionDB (Singleton) directamente via JDBC,
# NO Spring Data, por eso no hay spring.datasource.* de JPA aqui.
# Se pueden reemplazar con las variables de entorno DB_URL, DB_USUARIO y DB_PASSWORD.
db.url=jdbc:postgresql://127.0.0.1:5433/bustracka_db
db.usuario=bustracka_user
db.password=bustracka_pass
db.driver=org.postgresql.Driver

# ==== JWT ====
# Clave secreta HS256 en Base64 (>= 256 bits) desde la variable de entorno JWT_SECRET.
# Si no se define, el backend genera una clave aleatoria al arrancar (las sesiones se pierden al reiniciar).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000

# ==== Logging ====
logging.level.pe.edu.ulima.is2.bustracka=DEBUG

# ==== Release 1 y 2 ====
# URL base del frontend (enlaces de los correos, del QR y del seguimiento compartido)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Origenes permitidos por CORS, separados por coma
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Cuantas veces mas rapido que la realidad se mueve el bus simulado (demo)
tracking.velocidad-simulada=60
# Webhook de n8n que envia los correos (comprobante y recuperacion). Vacio = solo log.
notificacion.webhook-url=${NOTIFICACION_WEBHOOK_URL:http://localhost:5678/webhook/comprobante}
